name: Generate 3D Profile SVG

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download 3D Profile SVG
        run: |
          # Using the exact URL from your screenshot
          curl -L -o profile-3d.svg "https://isometric-contributions-spectrewolf8.onrender.com/api/graph?username=gauravscripts&theme=light&stats=true"

      - name: Verify file exists
        run: test -f profile-3d.svg || (echo "SVG not found!" && exit 1)

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile-3d.svg
          git commit -m "chore: update profile-3d.svg [skip ci]" || exit 0
          git push